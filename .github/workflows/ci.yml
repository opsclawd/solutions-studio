name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, Unit & Browser Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Check boundaries
        run: pnpm boundaries

      # Must run before Typecheck: apps/web's tsconfig.json includes
      # .next/types/**/*.ts, which only exists after `next build` generates it.
      - name: Build all workspaces
        run: pnpm -r --if-present build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run all unit tests
        env:
          PUPPETEER_CONFIG_PATH: ${{ github.workspace }}/.github/puppeteer-config.json
        run: pnpm -r --if-present test

      - name: Run Orchestrator Integration Tests
        run: pnpm --filter @solutions-studio/orchestrator test:integration

      - name: Run Phase 1 Exit Gate Integration
        run: pnpm --filter @solutions-studio/orchestrator exit-gate:phase1

      - name: Run Phase 2 Exit Gate Integration
        run: pnpm --filter @solutions-studio/orchestrator exit-gate:phase2

      - name: Run Phase 3 Exit Gate Integration
        run: pnpm --filter @solutions-studio/orchestrator exit-gate:phase3

      - name: Install Playwright Browsers
        run: pnpm --filter @solutions-studio/web exec playwright install --with-deps chromium

      - name: Run Playwright Browser Tests
        run: pnpm --filter @solutions-studio/web test:browser
