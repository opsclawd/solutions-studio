name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test Orchestrator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build orchestrator
        run: pnpm --filter @solutions-studio/orchestrator build

      - name: Build web
        run: pnpm --filter @solutions-studio/web build

      - name: Run orchestrator unit tests
        env:
          PUPPETEER_CONFIG_PATH: ${{ github.workspace }}/.github/puppeteer-config.json
        run: pnpm --filter @solutions-studio/orchestrator test

      - name: Run web unit tests
        run: pnpm --filter @solutions-studio/web test
